<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список бажань</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Список бажань</h1>
    </header>

    <div class="content">
      <main>
        <section>
          <h2>Додати бажання</h2>
          <form class="add-wish-form">
            <label for="add-wish-title-input">Назва бажання</label>
            <input class="add-wish-input" type="text" placeholder="Машина" id="add-wish-title-input" name="wish-title">

            <label for="add-wish-price-input">Ціна бажання</label>
            <input class="add-wish-input" type="number" placeholder="10000 (вказується в гривнях)" min="0" step="0.01" id="add-wish-price-input" name="wish-price">

            <label for="wishPriority">Пріоритет</label>
            <select id="wishPriority" class="priority-select" required>
              <option value="low">Низький ⚪</option>
              <option value="medium" selected>Середній 🟡</option>
              <option value="high">Високий 🔴</option>
            </select>

            <div class="add-wish-btn-container">
              <button type="submit" class="add-wish-btn add-wish-btn-submit">Додати бажання</button>
              <button type="reset" class="add-wish-btn add-wish-btn-reset">Очистити поля</button>
            </div>
          </form>
        </section>
    
        <section>
          <h2>Мої бажання</h2>
          <div class="cards">
            <article class="wish-card priority-high">
              <h3>Сумка</h3>
              <p>1000 грн</p>
            </article>
            <article class="wish-card priority-low wish-card--purchased">
              <h3>Друшляк</h3>
              <p>500 грн</p>
            </article>
          </div>
        </section>
      </main>

      <aside>
        <h2>Підсумкова сума</h2>
        <p>1500 грн</p>
      </aside>
    </div>

    <footer>
      <p>Яценко М.І. Дані надані навчальним прикладом. Список бажань. © 2026</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
